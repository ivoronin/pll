version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: all
  disable:
    # Requires allowlist configuration
    - depguard
    # Too strict - not all struct fields need initialization
    - exhaustruct
    # Small CLIs commonly use globals for version, config, styles
    - gochecknoglobals
    # Magic numbers common in CLI/TUI code
    - mnd
    # Too strict for CLI tools
    - wrapcheck

issues:
  exclude-rules:
    # Relax rules for test files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - forcetypeassert
